<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publius Nakamoto — Course Studies</title>
<meta name="description" content="Publius Nakamoto turns Peterson Academy courses into overview videos, slide decks, deep-dive podcasts, and study guides.">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="bg-[#f4ecd8] text-[#2c2416]">
<header class="border-b border-[#3a2f22]/15 bg-[#f4ecd8]/90 backdrop-blur-sm sticky top-0 z-10">
<div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
<a class="font-serif text-lg tracking-wide text-[#2c2416]" href="/">Publius Nakamoto</a>
<nav class="flex items-center gap-6 text-sm text-[#2c2416]/80">
<a href="/" class="hover:text-[#2c2416] transition-colors">Home</a>
<a href="/projects" class="hover:text-[#2c2416] transition-colors">Projects</a>
<a href="/about" class="hover:text-[#2c2416] transition-colors">About</a>
<a class="text-[#2c2416] font-semibold" href="/contact" aria-current="page">Contact</a>
</nav>
</div>
</header>
<div class="min-h-screen">
<div class="max-w-2xl mx-auto px-4 py-12">
<h1 class="font-serif text-4xl text-gray-900 mb-2">Contact</h1>
<p class="text-gray-600 mb-8">Questions about a course study, or a Peterson Academy course you'd like to see turned into a deep dive? Send a message.</p>
<form class='space-y-6' method='POST' name='contact' data-netlify="true" netlify-honeypot="bot-field">
<input type="hidden" value="contact" name="form-name">
<p hidden><label>Don't fill this out: <input name="bot-field"></label></p>
<div>
<label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
<input id="name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" placeholder="Your name" type="text" name="name">
</div>
<div>
<label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
<input id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" placeholder="your@email.com" type="email" name="email">
</div>
<div>
<label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
<textarea id="message" name="message" required rows="6" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors resize-none" placeholder="Your message..."></textarea>
</div>
<button type="submit" class="inline-flex items-center gap-2 px-6 py-3 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors font-medium">Send Message</button>
</form>
</div>
</div>
</body>
</html>
